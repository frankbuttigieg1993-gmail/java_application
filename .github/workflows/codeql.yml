name: CodeQL Scan

on:
  push:
    branches:
      - main
      - pr_test
      - release/*
  pull_request:
    branches:
      - main
      - release/*
  schedule:
    - cron: '30 1 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: CodeQL Security Scan
        uses: frankbuttigieg1993-gmail/cicd/.github/actions/codeql-scan@main
        with:
          java-version: '21'
          query-suite: security-extended
          enforce-policy: 'true'
