name: Build Scanning All Composite
run-name: ${{ github.ref_name }}.${{ github.run_number }}

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

jobs:
  build:
    name: '-'
    uses: frankbuttigieg1993-gmail/cicd/.github/workflows/java-build-selfhosted-scanning-all-composite.yml@main
    permissions:
      id-token: write
      contents: write 
      security-events: write
      actions: read
      issues: write
    with:
      target-runner: "['self-hosted', 'linux', 'x64']"
    secrets: inherit