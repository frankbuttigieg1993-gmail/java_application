# Enable parallel project execution
org.gradle.parallel=true

# Enable the Gradle Build Cache to reuse outputs from previous builds
org.gradle.caching=true

# Enable the Configuration Cache to skip the configuration phase when build logic hasn't changed
org.gradle.configuration-cache=true

# Allocate sufficient memory to the Gradle Daemon for faster builds
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
