# 1. Enable Gradle Daemon (Keeps Gradle running in the background to avoid startup overhead)
org.gradle.daemon=true

# 2. Enable Parallel Execution (Builds decoupled modules concurrently; vital for multi-module projects)
org.gradle.parallel=true

# 3. Enable Build Cache (Caches and reuses outputs from previous builds locally)
org.gradle.caching=true

# 4. Enable Configuration Cache (Caches the configuration phase to skip evaluating build files when unchanged)
org.gradle.configuration-cache=true

# 5. Optimize the JVM for heavy Java compilation using JDK 17/21
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8